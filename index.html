<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>근무시간 기록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
  <link rel="stylesheet" href="/assets/style.css?v=3">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">우리 매장 근무시간 기록</p>
      <h1>출·퇴근 시각만 적으세요.<br>한 달 근무시간은 알아서 더해 드려요.</h1>
      <p class="muted">매일 직원별 출근·퇴근 시각을 적으면, 이번 달 직원별 총 근무시간이 바로 바뀌어요. 모든 지점을 같이 보고 적을 수 있어요.</p>
    </section>

    <form id="login" class="card" novalidate>
      <h2>들어가기</h2>
      <div class="field">
        <label for="password">공용 비밀번호</label>
        <input id="password" type="password" inputmode="numeric" autocomplete="current-password" required>
      </div>
      <button class="full" type="submit">들어가기</button>
      <p id="msg" class="msg err" role="alert"></p>
      <p class="muted">비밀번호는 사장님께 물어보세요.</p>
    </form>

    <footer class="muted"><a href="/privacy">개인정보 처리방침</a></footer>
  </main>

  <script src="/assets/auth.js?v=3"></script>
  <script>
    if (Auth.signedIn()) location.replace('/app');
    const form = document.getElementById('login');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = form.password.value;
      if (!pw) { msg.textContent = '비밀번호를 넣어 주세요.'; return; }
      const btn = form.querySelector('button');
      btn.disabled = true; msg.textContent = '';
      try {
        await Auth.login(pw);
        location.href = '/app';
      } catch (err) {
        msg.textContent = err.message;
        form.password.value = '';
        form.password.focus();
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
