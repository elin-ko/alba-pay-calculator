<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>지점 관리 — 근무시간 기록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <a href="/app">하루씩 적기</a>
      <a href="/month">한 달 표</a>
      <a href="/admin" class="on">지점 관리</a>
      <button id="logout" type="button">나가기</button>
    </nav>

    <section class="card">
      <h2>지점별 근무시간</h2>
      <div class="field"><input id="month" type="month" aria-label="달"></div>
      <div id="report"><p class="muted">불러오는 중…</p></div>
    </section>

    <section class="card">
      <h2>지점</h2>
      <div id="branches"></div>
      <form id="addBranch" class="inline" novalidate style="margin-top:12px">
        <input name="name" type="text" maxlength="40" placeholder="새 지점 이름" aria-label="새 지점 이름">
        <button type="submit">추가</button>
      </form>
      <p class="msg" id="branchMsg" role="status"></p>
    </section>
  </main>

  <script src="/assets/auth.js"></script>
  <script>
    if (!Auth.signedIn()) location.replace('/');

    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, '0');
    const hm = (min) => { const h = Math.floor(min / 60), m = min % 60; return m ? `${h}시간 ${m}분` : `${h}시간`; };
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const setMsg = (el, t, k) => { el.textContent = t || ''; el.className = 'msg' + (k ? ' ' + k : ''); };
    const post = (body) => Auth.api('/api/admin', { method: 'POST', body: JSON.stringify(body) });
    let data = null;

    async function load() {
      data = await Auth.api('/api/admin?month=' + $('month').value);
      render();
    }

    function render() {
      // 지점은 늘 ㄱㄴㄷ순 (영어·숫자가 섞여도 한국어 기준으로)
      data.branches.sort((a, b) => a.name.localeCompare(b.name, 'ko', { numeric: true }));
      const per = new Map();
      for (const s of data.shifts) per.set(s.staff_id, (per.get(s.staff_id) || 0) + s.minutes);
      $('report').innerHTML = data.branches.length ? data.branches.map((b) => {
        const staff = data.staff.filter((s) => s.branch_id === b.id && (s.active || per.has(s.id)));
        const total = staff.reduce((a, s) => a + (per.get(s.id) || 0), 0);
        return `<div style="margin-bottom:16px">
          <div class="grand"><span>${esc(b.name)}</span><span class="num">${hm(total)}</span></div>
          ${staff.map((s) => `<div class="total-row"><span>${esc(s.name)}${s.active ? '' : ' <span class="tag">· 그만둠</span>'}</span><span class="num" style="font-size:18px">${hm(per.get(s.id) || 0)}</span></div>`).join('') || '<p class="muted" style="margin-top:8px">직원이 아직 없어요.</p>'}
        </div>`;
      }).join('') : '<p class="muted">아래에서 지점을 먼저 추가해 주세요.</p>';

      $('branches').innerHTML = data.branches.map((b) => `<div class="list-row"><span>${esc(b.name)}<br><span class="tag">직원 ${data.staff.filter((s) => s.branch_id === b.id && s.active).length}명</span></span>
          <button class="ghost small" type="button" data-rename="${b.id}" data-name="${esc(b.name)}">이름 바꾸기</button></div>`).join('') || '<p class="muted">아직 지점이 없어요.</p>';
    }

    $('logout').addEventListener('click', () => Auth.logout());
    $('month').addEventListener('change', () => load().catch((err) => setMsg($('branchMsg'), err.message, 'err')));

    $('addBranch').addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = e.target.name.value.trim();
      if (!n) return setMsg($('branchMsg'), '지점 이름을 적어 주세요.', 'err');
      try { await post({ action: 'branch', name: n }); e.target.name.value = ''; await load(); setMsg($('branchMsg'), `${n} 지점을 추가했어요.`, 'ok'); }
      catch (err) { setMsg($('branchMsg'), err.message, 'err'); }
    });

    // 팝업(prompt)은 휴대폰 앱 안 브라우저에서 막히는 일이 많아서, 그 줄에서 바로 고치게 한다
    $('branches').addEventListener('click', (e) => {
      const b = e.target.closest('[data-rename]');
      if (b) {
        const row = b.closest('.list-row');
        row.innerHTML = `<form class="inline" style="width:100%" data-id="${b.dataset.rename}" data-old="${esc(b.dataset.name)}">
            <input type="text" maxlength="40" value="${esc(b.dataset.name)}" aria-label="새 지점 이름">
            <button class="small" type="submit">저장</button>
            <button class="ghost small" type="button" data-cancel>취소</button></form>`;
        const inp = row.querySelector('input');
        inp.focus();
        inp.select();
        return;
      }
      if (e.target.closest('[data-cancel]')) { setMsg($('branchMsg'), ''); render(); }
    });
    $('branches').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const n = f.querySelector('input').value.trim();
      if (!n) return setMsg($('branchMsg'), '새 지점 이름을 적어 주세요.', 'err');
      if (n === f.dataset.old) { render(); return; }
      f.querySelectorAll('button').forEach((x) => { x.disabled = true; });
      try { await post({ action: 'rename', branch_id: Number(f.dataset.id), name: n }); await load(); setMsg($('branchMsg'), `'${n}'(으)로 바꿨어요.`, 'ok'); }
      catch (err) { setMsg($('branchMsg'), err.message, 'err'); f.querySelectorAll('button').forEach((x) => { x.disabled = false; }); }
    });

    const now = new Date();
    $('month').value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
    if (Auth.signedIn()) load().catch((err) => setMsg($('branchMsg'), err.message, 'err'));
  </script>
</body>
</html>
